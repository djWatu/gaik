<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grafik Pracy GAIK</title>
    <style>
        :root {
            --bg-color: #fcf9f2; /* Ciepły, kremowy odcień tła */
            --cell-bg: #fff;
            --border-color: #d2c5bc;
            --text-main: #4a2c11; /* Ciemny brąz z logo */
            
            /* Kolory z logo */
            --open-shift: #e88d2d; /* Pomarańczowy liść */
            --normal-shift: #669933; /* Zielony liść */
            --day-off: #cc4455; /* Malinowy liść */
            --custom-shift: #7a5c4d; /* Brąz wpadający w szarość */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Kontener na logo */
        .logo-container {
            text-align: center;
            background: #fff;
            padding: 15px 10px 5px 10px;
        }

        .logo-container img {
            max-height: 70px; /* Ograniczenie wielkości, by nie zdominowało ekranu */
            width: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 15px 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(74, 44, 17, 0.1);
            z-index: 10;
        }

        header button {
            padding: 8px 15px;
            border: 2px solid var(--text-main);
            border-radius: 5px;
            background: #fff;
            color: var(--text-main);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        header button:active {
            background: var(--text-main);
            color: #fff;
        }

        h1 {
            font-size: 17px;
            margin: 0;
            text-align: center;
            color: var(--text-main);
        }

        .table-container {
            flex-grow: 1;
            overflow-x: auto;
            overflow-y: auto;
            background: var(--bg-color);
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 900px;
        }

        th, td {
            border: 1px solid var(--border-color);
            text-align: center;
            height: 45px;
            min-width: 50px;
            font-size: 13px;
        }

        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background: #fff;
            font-weight: bold;
            z-index: 2;
            width: 100px;
            color: var(--text-main);
            box-shadow: 2px 0 4px rgba(74, 44, 17, 0.05);
        }

        th {
            background: #f1ebe5;
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 5px;
            color: var(--text-main);
        }

        th:first-child { z-index: 3; }

        .shift-cell {
            cursor: pointer;
            font-weight: bold;
            color: var(--text-main);
            transition: background-color 0.1s;
        }

        /* Klasy kolorów zmian dopasowane do logo */
        .shift-open { background-color: var(--open-shift) !important; color: white !important; font-size: 11px;}
        .shift-normal { background-color: var(--normal-shift) !important; color: white !important; font-size: 11px;}
        .shift-off { background-color: var(--day-off) !important; color: white !important; font-size: 14px;}
        
        td:not(:first-child) {
            background-color: var(--cell-bg);
        }

        .toolbar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #fff;
            box-shadow: 0 -2px 10px rgba(74, 44, 17, 0.1);
            z-index: 10;
            flex-wrap: wrap;
            gap: 5px;
            border-top: 2px solid var(--text-main);
        }

        .tool-btn {
            flex: 1 1 20%;
            padding: 10px 2px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            border-radius: 6px;
            border: none;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .tool-btn.active {
            box-shadow: inset 0 0 0 3px rgba(0,0,0,0.5);
            transform: scale(0.93);
        }

        .btn-open { background: var(--open-shift); }
        .btn-normal { background: var(--normal-shift); }
        .btn-off { background: var(--day-off); }
        .btn-clear { background: #b0a39a; color: var(--text-main); }
        .btn-custom { background: var(--custom-shift); flex-basis: 100%; margin-top: 5px; padding: 12px;}
    </style>
</head>
<body>

    <!-- Sekcja z Logo -->
    <div class="logo-container">
        <img src="https://gaik.edu.pl/wp-content/uploads/2025/02/Gaik_logo_napis_03-300x186.png" alt="GAIK Logo">
    </div>

    <header>
        <button id="prev-month">&lt;</button>
        <h1 id="month-display">Ładowanie...</h1>
        <button id="next-month">&gt;</button>
    </header>

    <div class="table-container">
        <table id="schedule-table">
            <thead><tr id="days-header"></tr></thead>
            <tbody id="schedule-body"></tbody>
        </table>
    </div>

    <div class="toolbar">
        <button class="tool-btn active btn-open" data-val="6:30-14:30">6:30-14:30</button>
        <button class="tool-btn btn-normal" data-val="7-15">7-15</button>
        <button class="tool-btn btn-normal" data-val="7:30-15:30">7:30-15:30</button>
        <button class="tool-btn btn-normal" data-val="8-16">8-16</button>
        <button class="tool-btn btn-normal" data-val="8:45-16:45">8:45-16:45</button>
        <button class="tool-btn btn-off" data-val="W">Wolne (W)</button>
        <button class="tool-btn btn-clear" data-val="">Usuń</button>
        <button class="tool-btn btn-custom" id="tool-custom" data-val="custom">Wpisz inną zmianę...</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Konfiguracja Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDNfjtR4nKFw9UAAAvHSxiLuQN_ePspEeQ",
            authDomain: "gaik-1b8f1.firebaseapp.com",
            databaseURL: "https://gaik-1b8f1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gaik-1b8f1",
            storageBucket: "gaik-1b8f1.firebasestorage.app",
            messagingSenderId: "774637288052",
            appId: "1:774637288052:web:6f517311abb80aedad6f21"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            const employees = ["Karolina Wicik", "Wiktoria Tomanek", "Luiza Miśta", "Klaudia Fuss", "Julia Bil"];
            let currentDate = new Date();
            let selectedToolValue = "6:30-14:30";
            let scheduleData = {};
            let unsubscribeListener = null;

            // Obsługa klikania w paski narzędzi
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    if (e.target.dataset.val === 'custom') {
                        const customShift = prompt("Wpisz tekst (np. L4, Urlop, 10:00-18:00):");
                        if (customShift !== null && customShift.trim() !== '') {
                            selectedToolValue = customShift;
                            e.target.textContent = `Własne: ${customShift}`;
                        }
                    } else {
                        selectedToolValue = e.target.dataset.val;
                        document.getElementById('tool-custom').textContent = "Wpisz inną zmianę...";
                    }
                });
            });

            function getMonthKey(year, month) {
                return `${year}-${month}`;
            }

            // Pobieranie danych z bazy (z obsługą błędu pobierania)
            function loadMonthData() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const monthKey = getMonthKey(year, month);
                
                if (unsubscribeListener) unsubscribeListener();

                const monthRef = ref(db, 'grafik/' + monthKey);
                
                unsubscribeListener = onValue(monthRef, (snapshot) => {
                    scheduleData[monthKey] = snapshot.val() || {};
                    renderCalendarUI(year, month, monthKey);
                }, (error) => {
                    alert("⚠️ Odmowa dostępu do bazy. Sprawdź reguły (Rules) w Firebase! Błąd: " + error.message);
                });
            }

            // Rysowanie grafiku
            function renderCalendarUI(year, month, monthKey) {
                const monthNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
                document.getElementById('month-display').textContent = `${monthNames[month]} ${year}`;

                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                let headerHtml = '<th>Pracownik</th>';
                for (let i = 1; i <= daysInMonth; i++) {
                    headerHtml += `<th>${i}</th>`;
                }
                document.getElementById('days-header').innerHTML = headerHtml;

                let bodyHtml = '';
                employees.forEach((emp, empIndex) => {
                    bodyHtml += `<tr><td>${emp}</td>`;
                    for (let day = 1; day <= daysInMonth; day++) {
                        const cellData = scheduleData[monthKey][`${empIndex}-${day}`] || '';
                        let colorClass = '';
                        
                        if (cellData.startsWith('6:30')) colorClass = 'shift-open';
                        else if (cellData === 'W' || cellData.toLowerCase() === 'wolne') colorClass = 'shift-off';
                        else if (cellData !== '') colorClass = 'shift-normal';

                        bodyHtml += `<td class="shift-cell ${colorClass}" data-emp="${empIndex}" data-day="${day}">${cellData}</td>`;
                    }
                    bodyHtml += `</tr>`;
                });
                document.getElementById('schedule-body').innerHTML = bodyHtml;
            }

            // Obsługa wpisywania zmian po kliknięciu kafelka
            document.getElementById('schedule-body').addEventListener('click', function(e) {
                if (e.target.classList.contains('shift-cell')) {
                    const empId = e.target.dataset.emp;
                    const day = e.target.dataset.day;
                    const year = currentDate.getFullYear();
                    const month = currentDate.getMonth();
                    const monthKey = getMonthKey(year, month);
                    
                    // Pokazujemy zmianę na ekranie od razu dla wygody
                    e.target.textContent = selectedToolValue;
                    
                    // Zapisujemy w Firebase
                    set(ref(db, `grafik/${monthKey}/${empId}-${day}`), selectedToolValue)
                        .catch(error => {
                            alert("⚠️ Nie udało się zapisać zmiany! Odrzucone przez Firebase. Błąd: " + error.message);
                        });
                }
            });

            // Zmiana miesięcy
            document.getElementById('prev-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                loadMonthData();
            });

            document.getElementById('next-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                loadMonthData();
            });

            loadMonthData();
            
        } catch (error) {
            alert("Błąd podczas uruchamiania aplikacji: " + error.message);
        }
    </script>
</body>
</html>

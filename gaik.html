<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grafik Pracy GAIK</title>
    <style>
        :root {
            --bg-color: #fcf9f2; 
            --cell-bg: #fff;
            --border-color: #d2c5bc;
            --text-main: #4a2c11; 
            
            /* Unikalne kolory dla każdej zmiany */
            --shift-open: #e88d2d; /* 6:30 - Pomarańczowy */
            --shift-7: #42a5f5; /* 7-15 - Jasnoniebieski */
            --shift-730: #26a69a; /* 7:30-15:30 - Turkusowy */
            --shift-8: #ab47bc; /* 8-16 - Fioletowy */
            --shift-845: #5c6bc0; /* 8:45-16:45 - Granatowy */
            
            --day-off: #669933; /* Wolne (W) - Zielony (z logo) */
            --sick-leave: #cc4455; /* L4 - Malinowy (z logo) */
            --custom-shift: #7a5c4d; /* Inna zmiana - Brązowy */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .logo-container {
            text-align: center;
            background: #fff;
            padding: 15px 10px 5px 10px;
        }

        .logo-container img {
            max-height: 70px;
            width: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 15px 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(74, 44, 17, 0.1);
            z-index: 10;
        }

        header button {
            padding: 8px 15px;
            border: 2px solid var(--text-main);
            border-radius: 5px;
            background: #fff;
            color: var(--text-main);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        header button:active {
            background: var(--text-main);
            color: #fff;
        }

        h1 {
            font-size: 17px;
            margin: 0;
            text-align: center;
            color: var(--text-main);
        }

        .table-container {
            flex-grow: 1;
            overflow-x: auto;
            overflow-y: auto;
            background: var(--bg-color);
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 950px;
        }

        th, td {
            border: 1px solid var(--border-color);
            text-align: center;
            height: 45px;
            min-width: 50px;
            font-size: 13px;
        }

        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background: #fff;
            font-weight: bold;
            z-index: 2;
            width: 100px;
            color: var(--text-main);
            box-shadow: 2px 0 4px rgba(74, 44, 17, 0.05);
        }

        th {
            background: #f1ebe5;
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 4px;
            color: var(--text-main);
        }

        th:first-child { z-index: 3; }

        .shift-cell {
            cursor: pointer;
            font-weight: bold;
            color: var(--text-main);
            transition: background-color 0.1s;
        }

        /* Klasy kolorów komórek */
        .shift-open { background-color: var(--shift-open) !important; color: white !important; font-size: 11px;}
        .shift-7 { background-color: var(--shift-7) !important; color: white !important; font-size: 11px;}
        .shift-730 { background-color: var(--shift-730) !important; color: white !important; font-size: 11px;}
        .shift-8 { background-color: var(--shift-8) !important; color: white !important; font-size: 11px;}
        .shift-845 { background-color: var(--shift-845) !important; color: white !important; font-size: 11px;}
        .shift-off { background-color: var(--day-off) !important; color: white !important; font-size: 14px;}
        .shift-l4 { background-color: var(--sick-leave) !important; color: white !important; font-size: 12px;}
        .shift-custom { background-color: var(--custom-shift) !important; color: white !important; font-size: 11px;}
        
        td:not(:first-child) {
            background-color: var(--cell-bg);
        }

        .toolbar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #fff;
            box-shadow: 0 -2px 10px rgba(74, 44, 17, 0.1);
            z-index: 10;
            flex-wrap: wrap;
            gap: 5px;
            border-top: 2px solid var(--text-main);
        }

        .tool-btn {
            flex: 1 1 20%;
            padding: 8px 2px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            border-radius: 6px;
            border: none;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .tool-btn.active {
            box-shadow: inset 0 0 0 3px rgba(0,0,0,0.6);
            transform: scale(0.93);
        }

        /* Kolory przycisków stempli */
        .btn-open { background: var(--shift-open); }
        .btn-7 { background: var(--shift-7); }
        .btn-730 { background: var(--shift-730); }
        .btn-8 { background: var(--shift-8); }
        .btn-845 { background: var(--shift-845); }
        .btn-off { background: var(--day-off); }
        .btn-l4 { background: var(--sick-leave); }
        .btn-clear { background: #b0a39a; color: var(--text-main); }
        .btn-custom { background: var(--custom-shift); flex-basis: 100%; margin-top: 5px; padding: 12px;}

        /* Mała czcionka dla dni tygodnia */
        .day-name {
            font-size: 9px;
            font-weight: normal;
            margin-top: 2px;
        }
        .weekend-text {
            color: #cc4455;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://gaik.edu.pl/wp-content/uploads/2025/02/Gaik_logo_napis_03-300x186.png" alt="GAIK Logo">
    </div>

    <header>
        <button id="prev-month">&lt;</button>
        <h1 id="month-display">Ładowanie...</h1>
        <button id="next-month">&gt;</button>
    </header>

    <div class="table-container">
        <table id="schedule-table">
            <thead><tr id="days-header"></tr></thead>
            <tbody id="schedule-body"></tbody>
        </table>
    </div>

    <div class="toolbar">
        <button class="tool-btn active btn-open" data-val="6:30-14:30">6:30</button>
        <button class="tool-btn btn-7" data-val="7-15">7-15</button>
        <button class="tool-btn btn-730" data-val="7:30-15:30">7:30</button>
        <button class="tool-btn btn-8" data-val="8-16">8-16</button>
        <button class="tool-btn btn-845" data-val="8:45-16:45">8:45</button>
        <button class="tool-btn btn-off" data-val="W">Wolne</button>
        <button class="tool-btn btn-l4" data-val="L4 💊">L4 💊</button>
        <button class="tool-btn btn-clear" data-val="">Usuń</button>
        <button class="tool-btn btn-custom" id="tool-custom" data-val="custom">Wpisz inną zmianę...</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDNfjtR4nKFw9UAAAvHSxiLuQN_ePspEeQ",
            authDomain: "gaik-1b8f1.firebaseapp.com",
            databaseURL: "https://gaik-1b8f1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gaik-1b8f1",
            storageBucket: "gaik-1b8f1.firebasestorage.app",
            messagingSenderId: "774637288052",
            appId: "1:774637288052:web:6f517311abb80aedad6f21"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            const employees = ["Karolina Wicik", "Wiktoria Tomanek", "Luiza Miśta", "Klaudia Fuss", "Julia Bil"];
            const daysOfWeekNames = ["Nd", "Pn", "Wt", "Śr", "Cz", "Pt", "Sb"];
            
            let currentDate = new Date();
            let selectedToolValue = "6:30-14:30";
            let scheduleData = {};
            let unsubscribeListener = null;

            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    if (e.target.dataset.val === 'custom') {
                        const customShift = prompt("Wpisz tekst (np. Opieka, Urlop, 10-18):");
                        if (customShift !== null && customShift.trim() !== '') {
                            selectedToolValue = customShift;
                            e.target.textContent = `Własne: ${customShift}`;
                        }
                    } else {
                        selectedToolValue = e.target.dataset.val;
                        document.getElementById('tool-custom').textContent = "Wpisz inną zmianę...";
                    }
                });
            });

            function getMonthKey(year, month) {
                return `${year}-${month}`;
            }

            function loadMonthData() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const monthKey = getMonthKey(year, month);
                
                if (unsubscribeListener) unsubscribeListener();

                const monthRef = ref(db, 'grafik/' + monthKey);
                
                unsubscribeListener = onValue(monthRef, (snapshot) => {
                    scheduleData[monthKey] = snapshot.val() || {};
                    renderCalendarUI(year, month, monthKey);
                }, (error) => {
                    alert("⚠️️ Odmowa dostępu do bazy. Błąd: " + error.message);
                });
            }

            function renderCalendarUI(year, month, monthKey) {
                const monthNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
                document.getElementById('month-display').textContent = `${monthNames[month]} ${year}`;

                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                let headerHtml = '<th>Pracownik</th>';
                for (let i = 1; i <= daysInMonth; i++) {
                    // Wyliczanie dnia tygodnia
                    const d = new Date(year, month, i);
                    const dayOfWeek = d.getDay();
                    const dayName = daysOfWeekNames[dayOfWeek];
                    
                    // Zaznaczenie weekendu na czerwono
                    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                    const weekendClass = isWeekend ? 'weekend-text' : '';

                    headerHtml += `
                        <th>
                            <div class="${weekendClass}">${i}</div>
                            <div class="day-name ${weekendClass}">${dayName}</div>
                        </th>`;
                }
                document.getElementById('days-header').innerHTML = headerHtml;

                let bodyHtml = '';
                employees.forEach((emp, empIndex) => {
                    bodyHtml += `<tr><td>${emp}</td>`;
                    for (let day = 1; day <= daysInMonth; day++) {
                        const cellData = scheduleData[monthKey][`${empIndex}-${day}`] || '';
                        let colorClass = '';
                        
                        // Rozpoznawanie kolorów na podstawie wpisanej wartości
                        if (cellData === '6:30-14:30') colorClass = 'shift-open';
                        else if (cellData === '7-15') colorClass = 'shift-7';
                        else if (cellData === '7:30-15:30') colorClass = 'shift-730';
                        else if (cellData === '8-16') colorClass = 'shift-8';
                        else if (cellData === '8:45-16:45') colorClass = 'shift-845';
                        else if (cellData === 'W' || cellData.toLowerCase() === 'wolne') colorClass = 'shift-off';
                        else if (cellData.includes('L4')) colorClass = 'shift-l4';
                        else if (cellData !== '') colorClass = 'shift-custom';

                        bodyHtml += `<td class="shift-cell ${colorClass}" data-emp="${empIndex}" data-day="${day}">${cellData}</td>`;
                    }
                    bodyHtml += `</tr>`;
                });
                document.getElementById('schedule-body').innerHTML = bodyHtml;
            }

            document.getElementById('schedule-body').addEventListener('click', function(e) {
                // Jeśli kliknięto na kratkę (td) lub na to co jest w jej środku
                let targetCell = e.target;
                if (!targetCell.classList.contains('shift-cell') && targetCell.parentElement.classList.contains('shift-cell')) {
                    targetCell = targetCell.parentElement;
                }

                if (targetCell.classList.contains('shift-cell')) {
                    const empId = targetCell.dataset.emp;
                    const day = targetCell.dataset.day;
                    const year = currentDate.getFullYear();
                    const month = currentDate.getMonth();
                    const monthKey = getMonthKey(year, month);
                    
                    targetCell.textContent = selectedToolValue;
                    
                    set(ref(db, `grafik/${monthKey}/${empId}-${day}`), selectedToolValue)
                        .catch(error => {
                            alert("⚠️ Błąd bazy Firebase: " + error.message);
                        });
                }
            });

            document.getElementById('prev-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                loadMonthData();
            });

            document.getElementById('next-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                loadMonthData();
            });

            loadMonthData();
            
        } catch (error) {
            alert("Błąd podczas uruchamiania aplikacji: " + error.message);
        }
    </script>
</body>
</html>
